<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0"
    />
    <link rel="stylesheet" href="styles.css" />
    <link
      href="https://cdn.jsdelivr.net/npm/phosphor-icons@1.4.2/src/css/icons.min.css"
      rel="stylesheet"
    />
  </head>
  <body>
    <div class="container">
      <h3 class="section-title">Стиль линии</h3>
      <div class="divider">
        <div class="line"></div>
        <div class="content">Solid</div>
        <div class="line"></div>
      </div>
      <div class="divider dashed">
        <div class="line"></div>
        <div class="content">Dashed</div>
        <div class="line"></div>
      </div>
      <div class="divider dotted">
        <div class="line"></div>
        <div class="content">Dotted</div>
        <div class="line"></div>
      </div>
      <div class="divider gradient">
        <div class="line"></div>
        <div class="content">Gradient</div>
        <div class="line"></div>
      </div>

      <h3 class="section-title">Контент</h3>
      <div class="divider">
        <div class="line"></div>
        <div class="content"><i class="ph-star"></i></div>
        <div class="line"></div>
      </div>
      <div class="divider">
        <div class="line"></div>
        <div class="content">Текст</div>
        <div class="line"></div>
      </div>
      <div class="divider">
        <div class="line"></div>
        <div class="content"><i class="ph-image-square"></i>Иконка и текст</div>
        <div class="line"></div>
      </div>
      <div class="divider">
        <div class="line"></div>
        <div class="content actions">
          <button><i class="ph-plus-circle"></i></button>
          <button><i class="ph-note-pencil"></i></button>
          <button><i class="ph-share-network"></i></button>
          <button><i class="ph-trash"></i></button>
        </div>
        <div class="line"></div>
      </div>
      <div class="divider">
        <div class="line"></div>
        <div class="line"></div>
      </div>

      <h3 class="section-title">Позиция контента</h3>
      <div class="divider start">
        <div class="line"></div>
        <div class="content"><i class="ph-star"></i>Слева</div>
        <div class="line"></div>
      </div>
      <div class="divider quarter">
        <div class="line"></div>
        <div class="content"><i class="ph-star"></i>25%</div>
        <div class="line"></div>
      </div>
      <div class="divider">
        <div class="line"></div>
        <div class="content"><i class="ph-star"></i>По центру</div>
        <div class="line"></div>
      </div>
      <div class="divider three-quarters">
        <div class="line"></div>
        <div class="content"><i class="ph-star"></i>75%</div>
        <div class="line"></div>
      </div>
      <div class="divider end">
        <div class="line"></div>
        <div class="content"><i class="ph-star"></i>Справа</div>
        <div class="line"></div>
      </div>
    </div>
  </body>
</html>
