<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Hero со световым лучом</title>
    <style>
      :root {
        --sky-300: oklch(82.8% 0.111 230.318);
        --sky-400: oklch(74.6% 0.16 232.661);
        --sky-600: oklch(58.8% 0.158 241.966);
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
      }

      .hero {
        position: relative;
        isolation: isolate; /* псевдоэлементы с z-index: -1 остаются внутри hero */
        display: grid;
        place-items: center;
        min-height: 100vh;
        overflow: hidden;
        background: var(--sky-600);
        color: white;
        font-family: system-ui, sans-serif;
        text-align: center;
      }

      .hero::before {
        content: "";
        position: absolute;
        inset: 0;
        z-index: -2;
        background: linear-gradient(
          to bottom,
          var(--sky-300) 0%,
          var(--sky-400) 35%,
          transparent 75%
        );
        clip-path: polygon(37% 0, 62% 0, 112% 100%, 12% 100%);
        filter: blur(30px);
        opacity: 0.9;
      }

      .hero::after {
        content: "";
        position: absolute;
        inset: 0;
        z-index: -1;
        background: url("noise.svg") center / 700px 700px repeat;
        opacity: 0.45;
        mask-image: linear-gradient(
          to bottom,
          #000 0%,
          rgba(0, 0, 0, 0.6) 100%
        );
        pointer-events: none;
      }

      .hero h1 {
        margin: 0 0 1rem;
        font-size: clamp(2rem, 6vw, 4.5rem);
        line-height: 1.1;
      }

      .hero p {
        margin: 0;
        font-size: 1.25rem;
        opacity: 0.9;
      }
    </style>
  </head>
  <body>
    <section class="hero">
      <div>
        <h1>Свет на главное</h1>
        <p>Фон со световым лучом и эффектом нойза на чистом CSS</p>
      </div>
    </section>
  </body>
</html>
